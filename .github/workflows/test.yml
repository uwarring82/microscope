name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install libusb
        run: brew install libusb
      - name: Build and test without a camera
        run: make test USB_PREFIX="$(brew --prefix libusb)"
  fits:
    name: Independent FITS validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation-only dependencies
        run: |
          python -m pip install -r requirements-validation.txt
          sudo apt-get update
          sudo apt-get install -y fitsverify
      - name: Verify synthetic exports at both resolutions
        run: python -m tools.verify_fits --fitsverify
